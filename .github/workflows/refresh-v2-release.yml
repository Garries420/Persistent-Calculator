name: One-time v2.0.0 release asset refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-v2-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  refresh-release-assets:
    if: github.repository == 'Garries420/Persistent-Calculator'
    runs-on: windows-latest
    env:
      RELEASE_TAG: v2.0.0
      SOURCE_RUN_ID: "30172496644"
      SOURCE_COMMIT: "cb29756fd3bf5d238af8ac568f96cf44a04ef3f8"
      EXPECTED_SHA256: "dcc6a8c0420d9834473c9de63d0610b5f972959bac56d391e58602925bdb8ab9"
    steps:
      - name: Download and verify tested build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($run.head_sha -ne $env:SOURCE_COMMIT) { throw "Source workflow commit does not match the tested source commit." }
          if ($run.status -ne "completed" -or $run.conclusion -ne "success") { throw "Source workflow was not successful." }

          New-Item -ItemType Directory -Force -Path staging, release | Out-Null
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name PersistentCalculator-windows-x64 --dir staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $executables = @(Get-ChildItem staging -Filter PersistentCalculator.exe -File -Recurse)
          if ($executables.Count -ne 1) { throw "Expected exactly one PersistentCalculator.exe in the tested artifact." }
          Copy-Item $executables[0].FullName release/PersistentCalculator.exe

          $hash = (Get-FileHash release/PersistentCalculator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256) { throw "Tested executable checksum mismatch." }
          [System.IO.File]::WriteAllText("release/PersistentCalculator.exe.sha256", "$hash  PersistentCalculator.exe$([Environment]::NewLine)", [System.Text.Encoding]::ASCII)

      - name: Replace only the v2.0.0 executable and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG release/PersistentCalculator.exe release/PersistentCalculator.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern PersistentCalculator.exe --pattern PersistentCalculator.exe.sha256 --dir verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash verify/PersistentCalculator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256) { throw "Published executable checksum mismatch." }
          $checksumText = (Get-Content verify/PersistentCalculator.exe.sha256 -Raw).Trim()
          if ($checksumText -ne "$env:EXPECTED_SHA256  PersistentCalculator.exe") { throw "Published checksum file does not match the executable." }
